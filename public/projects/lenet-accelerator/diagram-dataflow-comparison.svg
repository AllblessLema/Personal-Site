<text x="160.0" y="68" font-size="9.5" fill="#4a6fa5" text-anchor="middle" font-weight="600">CHOSEN</text>
<rect x="115.0" y="85.0" width="26" height="26" fill="none" stroke="#4a6fa5" stroke-width="1"/>
<rect x="145.0" y="85.0" width="26" height="26" fill="none" stroke="#4a6fa5" stroke-width="1"/>
<rect x="175.0" y="85.0" width="26" height="26" fill="none" stroke="#4a6fa5" stroke-width="1"/>
<rect x="115.0" y="115.0" width="26" height="26" fill="none" stroke="#4a6fa5" stroke-width="1"/>
<rect x="145.0" y="115.0" width="26" height="26" fill="none" stroke="#4a6fa5" stroke-width="1"/>
<rect x="175.0" y="115.0" width="26" height="26" fill="none" stroke="#4a6fa5" stroke-width="1"/>
<rect x="115.0" y="145.0" width="26" height="26" fill="none" stroke="#4a6fa5" stroke-width="1"/>
<rect x="145.0" y="145.0" width="26" height="26" fill="none" stroke="#4a6fa5" stroke-width="1"/>
<rect x="175.0" y="145.0" width="26" height="26" fill="none" stroke="#4a6fa5" stroke-width="1"/>
<text x="160.0" y="197.0" font-size="10" fill="#111" text-anchor="middle">Weights sit fixed in each PE.</text>
<text x="160.0" y="213.0" font-size="10" fill="#999" text-anchor="middle">Activations and partial sums move.</text>
<rect x="330" y="20" width="280" height="200" rx="8" fill="#fafafa" stroke="#e8e8e8" stroke-width="1"/>
<text x="470.0" y="50" font-size="12.5" fill="#111" text-anchor="middle" font-weight="700">Output-stationary</text>
