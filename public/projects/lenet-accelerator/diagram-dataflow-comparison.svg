<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="auto" font-family="ui-monospace, 'Courier New', monospace">
<title>Three dataflow options and which was chosen</title>
<desc>Weight-stationary was chosen for tractable control logic; output-stationary and row-stationary (Eyeriss) were considered and rejected for this project's scope.</desc>
