<text x="60" y="65.0" font-size="11" fill="#b5533c">◼</text>
<text x="80" y="65.0" font-size="10.5" fill="#111">Hardware bring-up</text>
<text x="620" y="65.0" font-size="9.5" fill="#b5533c" text-anchor="end">blocked — no x86 Vivado host yet</text>
