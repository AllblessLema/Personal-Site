<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="100%" height="auto" font-family="ui-monospace, 'Courier New', monospace">
<title>Resource budget against the XC7A35T's published capacity</title>
<desc>DSP and BRAM figures are derived, not measured, and are explicitly labelled as such. LUT and flip-flop usage is left blank because no synthesis has been run.</desc>
<text x="120" y="41.0" font-size="11" fill="#111" text-anchor="end" font-weight="600">DSP slices</text>
<rect x="130" y="28" width="420" height="20" rx="3" fill="none" stroke="#e8e8e8" stroke-width="1.3" stroke-dasharray="none"/>
<rect x="130" y="28" width="298.7" height="20" rx="3" fill="#4a6fa5"/>
<text x="558" y="43" font-size="10" fill="#111">64 / 90</text>
<text x="130" y="68" font-size="9" fill="#999" font-style="italic">intended mapping — not a synthesis result</text>
<text x="120" y="91.0" font-size="11" fill="#111" text-anchor="end" font-weight="600">BRAM (Kb)</text>
<rect x="130" y="78" width="420" height="20" rx="3" fill="none" stroke="#e8e8e8" stroke-width="1.3" stroke-dasharray="none"/>
<rect x="130" y="78" width="93.6" height="20" rx="3" fill="#4a6fa5"/>
<text x="558" y="93" font-size="10" fill="#111">401 / 1,800</text>
<text x="130" y="118" font-size="9" fill="#999" font-style="italic">derived from parameter counts — not a synthesis result</text>
<text x="120" y="141.0" font-size="11" fill="#111" text-anchor="end" font-weight="600">LUTs</text>
<rect x="130" y="128" width="420" height="20" rx="3" fill="none" stroke="#e8e8e8" stroke-width="1.3" stroke-dasharray="4,3"/>
<text x="340.0" y="143" font-size="10" fill="#999" text-anchor="middle">TBD</text>
<text x="558" y="143" font-size="10" fill="#999">of 20,800</text>
<text x="130" y="168" font-size="9" fill="#999" font-style="italic">TBD — no synthesis run yet</text>
<text x="120" y="191.0" font-size="11" fill="#111" text-anchor="end" font-weight="600">Flip-flops</text>
<rect x="130" y="178" width="420" height="20" rx="3" fill="none" stroke="#e8e8e8" stroke-width="1.3" stroke-dasharray="4,3"/>
<text x="340.0" y="193" font-size="10" fill="#999" text-anchor="middle">TBD</text>
<text x="558" y="193" font-size="10" fill="#999">of 41,600</text>
<text x="130" y="218" font-size="9" fill="#999" font-style="italic">TBD — no synthesis run yet</text>
</svg>