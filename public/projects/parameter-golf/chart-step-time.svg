<text x="130.0" y="290" font-size="10" fill="#999" text-anchor="middle">0</text>
<line x1="235.9" y1="10" x2="235.9" y2="274" stroke="#e8e8e8" stroke-width="1"/>
<text x="235.9" y="290" font-size="10" fill="#999" text-anchor="middle">400</text>
<line x1="341.8" y1="10" x2="341.8" y2="274" stroke="#e8e8e8" stroke-width="1"/>
<text x="341.8" y="290" font-size="10" fill="#999" text-anchor="middle">800</text>
<line x1="447.6" y1="10" x2="447.6" y2="274" stroke="#e8e8e8" stroke-width="1"/>
<text x="447.6" y="290" font-size="10" fill="#999" text-anchor="middle">1200</text>
<line x1="553.5" y1="10" x2="553.5" y2="274" stroke="#e8e8e8" stroke-width="1"/>
<text x="553.5" y="290" font-size="10" fill="#999" text-anchor="middle">1600</text>
<text x="355.0" y="298" font-size="10" fill="#999" text-anchor="middle">ms / step</text>
<text x="122" y="29.5" font-size="10.5" fill="#111" text-anchor="end">smoke_001</text>
<rect x="130" y="16.6" width="141.7" height="19.8" fill="#4a6fa5"/>
<text x="277.7" y="29.5" font-size="9.5" fill="#111">535 ms</text>
<text x="122" y="62.5" font-size="10.5" fill="#111" text-anchor="end">smoke_002</text>
<rect x="130" y="49.6" width="171.0" height="19.8" fill="#4a6fa5"/>
<text x="307.0" y="62.5" font-size="9.5" fill="#111">646 ms</text>
<text x="122" y="95.5" font-size="10.5" fill="#111" text-anchor="end">smoke_003</text>
<rect x="130" y="82.6" width="167.7" height="19.8" fill="#4a6fa5"/>
<text x="303.7" y="95.5" font-size="9.5" fill="#111">633 ms</text>
