<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="100%" height="auto" font-family="ui-monospace, 'Courier New', monospace">
<title>Milliseconds per training step across smoke-test configurations</title>
<desc>Baseline configurations train at roughly 530 to 650 milliseconds per step. Doubling sequence length to 2048 in smoke_008 raises step time to 1556 milliseconds, which is why that run hit the wallclock cap before finishing.</desc>
