<text x="307.9" y="128.5" font-size="9.5" fill="#111">650 ms</text>
<text x="122" y="161.5" font-size="10.5" fill="#111" text-anchor="end">smoke_005</text>
<rect x="130" y="148.6" width="140.7" height="19.8" fill="#4a6fa5"/>
<text x="276.7" y="161.5" font-size="9.5" fill="#111">532 ms</text>
<text x="122" y="194.5" font-size="10.5" fill="#111" text-anchor="end">smoke_006</text>
<rect x="130" y="181.6" width="167.0" height="19.8" fill="#4a6fa5"/>
